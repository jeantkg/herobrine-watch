[package]
name = "herobrine-watch-mod"
version = "0.3.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mod-api = { path = "../cinnabar/crates/mod-api" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[dev-dependencies]
wasmparser = "=0.247.0"
wit-component = "=0.247.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
